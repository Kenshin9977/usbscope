name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build & test (${{ matrix.rid }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            test: true
          - rid: win-arm64
            test: false

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10 SDK (from global.json)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ matrix.rid }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.rid }}-nuget-

      - name: Restore
        run: dotnet restore -r ${{ matrix.rid }}

      - name: Build
        run: dotnet build -c Release --no-restore -r ${{ matrix.rid }}

      - name: Test
        if: matrix.test
        run: dotnet test -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: matrix.test && always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.rid }}
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

      - name: Scan for vulnerable NuGet packages
        shell: pwsh
        run: |
          $output = dotnet list package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Output $output
          if ($output -match 'has the following vulnerable packages') {
            Write-Error "Vulnerable NuGet packages detected. Update them or pin to a non-affected version."
            exit 1
          }
